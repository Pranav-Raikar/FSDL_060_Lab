<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Registration | Real-time Validation</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.85);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --error-red: #ef4444;
            --success-green: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            overflow-x: hidden;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            padding: 2.5rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 440px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h2 { color: var(--text-dark); font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; text-align: center; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; text-align: center; }

        .form-group { margin-bottom: 1.2rem; position: relative; }
        
        input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(249, 250, 251, 0.8);
            border: 1.5px solid #e5e7eb;
            border-radius: 0.8rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background: #fff;
        }

        /* Field-specific error styling */
        .error-text {
            color: var(--error-red);
            font-size: 0.75rem;
            margin-top: 4px;
            display: block;
            min-height: 1em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-text.visible { opacity: 1; }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:disabled { background: #9ca3af; cursor: not-allowed; }

        #finalMsg { 
            margin-top: 1rem; 
            font-size: 0.9rem; 
            text-align: center; 
            padding: 0.75rem;
            border-radius: 0.75rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Create Account</h2>
        <p class="subtitle">Real-time Student Validation Portal</p>
        
        <form id="regForm" novalidate>
            <div class="form-group">
                <input type="text" id="username" placeholder="Full Name">
                <span class="error-text" id="usernameError"></span>
            </div>
            <div class="form-group">
                <input type="text" id="email" placeholder="Email (letters@abc.com)">
                <span class="error-text" id="emailError"></span>
            </div>
            <div class="form-group">
                <input type="text" id="phone" placeholder="Phone Number">
                <span class="error-text" id="phoneError"></span>
            </div>
            <div class="form-group">
                <input type="number" id="age" placeholder="Age">
                <span class="error-text" id="ageError"></span>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password">
                <span class="error-text" id="passwordError"></span>
            </div>
            <div class="form-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password">
                <span class="error-text" id="confirmPasswordError"></span>
            </div>
            
            <button type="submit" id="submitBtn">Sign Up</button>
        </form>

        <p id="finalMsg"></p>
    </div>

    <script src="form.js"></script>
</body>
</html>
