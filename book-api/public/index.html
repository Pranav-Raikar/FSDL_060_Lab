<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book API UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>📚 Library</h1>
            <p>Manage your books seamlessly.</p>
        </header>

        <main>
            <section class="add-book-section">
                <h2>Add a New Book</h2>
                <form id="addBookForm">
                    <input type="number" id="bookId" placeholder="ID (e.g. 3)" required>
                    <input type="text" id="bookTitle" placeholder="Title" required>
                    <input type="text" id="bookAuthor" placeholder="Author" required>
                    <button type="submit">Add Book</button>
                </form>
            </section>

            <section class="update-book-section">
                <h2>Update an Existing Book</h2>
                <form id="updateBookForm">
                    <input type="number" id="updateBookId" placeholder="ID to Update (e.g. 1)" required>
                    <input type="text" id="updateBookTitle" placeholder="New Title" required>
                    <input type="text" id="updateBookAuthor" placeholder="New Author" required>
                    <button type="submit" class="btn-update">Update Book</button>
                </form>
            </section>

            <section class="book-list-section">
                <h2>Your Books</h2>
                <div id="bookList" class="book-grid">
                    <!-- Books will be dynamically inserted here -->
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
